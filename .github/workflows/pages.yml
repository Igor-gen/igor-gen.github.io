name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject backend configuration into index.html
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "::error::Chýba repository variable BACKEND_URL"; exit 1; }
          mkdir site
          python3 - <<'PY'
          import os
          html = open('index.html', encoding='utf-8').read()
          placeholder = '__BACKEND_URL__'
          assert placeholder in html, placeholder + ' sa v index.html nenašiel'
          html = html.replace(placeholder, os.environ['BACKEND_URL'].strip())
          open('site/index.html', 'w', encoding='utf-8').write(html)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
