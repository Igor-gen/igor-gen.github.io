name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Tailwind CSS (statické CSS namiesto Play CDN)
        run: |
          mkdir -p tw-build
          cat > tw-build/input.css <<'CSS'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          CSS
          cat > tw-build/tailwind.config.js <<'CFG'
          /** @type {import('tailwindcss').Config} */
          module.exports = {
            content: ['index.html'],
            theme: {
              extend: {
                colors: {
                  maleBorder: '#1e40af', maleBg: '#eff6ff',
                  femaleBorder: '#be185d', femaleBg: '#fdf2f8',
                }
              }
            }
          };
          CFG
          npx -y tailwindcss@3.4.17 -c tw-build/tailwind.config.js -i tw-build/input.css -o tw-build/tailwind.css --minify
          echo "Vybuildené tailwind.css: $(wc -c < tw-build/tailwind.css) bajtov"

      - name: Inject backend configuration into index.html
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "::error::Chýba repository variable BACKEND_URL"; exit 1; }
          mkdir site
          python3 - <<'PY'
          import os, re
          html = open('index.html', encoding='utf-8').read()
          placeholder = '__BACKEND_URL__'
          assert placeholder in html, placeholder + ' sa v index.html nenašiel'
          html = html.replace(placeholder, os.environ['BACKEND_URL'].strip())

          # Náhrada Tailwind Play CDN statickým CSS (zdrojový index.html v repu zostáva bez zmeny)
          css = open('tw-build/tailwind.css', encoding='utf-8').read()
          style = '<style>\n' + css + '\n</style>\n'
          cdn_re = re.compile(r'[ \t]*<script src="https://cdn\.tailwindcss\.com"></script>\s*')
          cfg_re = re.compile(r'[ \t]*<script>\s*tailwind\.config\s*=\s*\{.*?\}\s*</script>\s*', re.DOTALL)
          m = cdn_re.search(html)
          assert m, 'Tailwind CDN script sa v index.html nenašiel - over zdrojový súbor'
          # vloženie CSS krájaním reťazca (nie re.sub) – minifikované CSS obsahuje
          # spätné lomítka, ktoré by re.sub chytil ako odkazy na regulárne skupiny
          html = html[:m.start()] + style + html[m.end():]
          html = cfg_re.sub('', html, count=1)
          open('site/index.html', 'w', encoding='utf-8').write(html)
          PY

      - name: Copy chat application to site
        run: cp chat.html site/chat.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
